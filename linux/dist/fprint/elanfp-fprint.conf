<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN" "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <policy user="root">
    <deny own="net.reactivated.Fprint"/>
  </policy>
  <policy user="elanfp-fprint">
    <allow own="net.reactivated.Fprint"/>
  </policy>
  <policy context="default">
    <allow send_destination="net.reactivated.Fprint" send_interface="net.reactivated.Fprint.Manager"/>
    <allow send_destination="net.reactivated.Fprint" send_interface="net.reactivated.Fprint.Device"/>
    <allow send_destination="net.reactivated.Fprint" send_interface="org.freedesktop.DBus.Introspectable"/>
    <allow send_destination="net.reactivated.Fprint" send_interface="org.freedesktop.DBus.Properties"/>
    <allow send_destination="net.reactivated.Fprint" send_interface="org.freedesktop.DBus.Peer"/>
  </policy>
</busconfig>
