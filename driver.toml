vendor = "ELAN Microelectronics"
model = "ELAN:Fingerprint"
kind = "image sensor 80x80, capacitive, match on host"
verified_firmware = ["26.30"]
laptops = ["Lenovo ThinkBook 16 G6 ABP (21KK)"]

[platform.linux]
