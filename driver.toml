components = ["elanfpd", "elanfp", "pam_elanfp.so", "elanfp-fprintd"]
requirements = ["Linux-PAM", "TPM 2.0 with systemd-creds (optional)", "D-Bus and polkit (optional, for desktop settings)"]

[platform.redox]
status = "alpha"
components = ["elanfpd", "elanfp"]
requirements = ["xhcid"]

