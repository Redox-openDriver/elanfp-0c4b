[package]
name = "elanfp-engine"
version = "0.1.0"
description = "elanfp: касания, регистрация, проверка и хранилище шаблонов — без привязки к ОС"
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["aes-256-gcm-siv"]
aes-256-gcm-siv = ["papilla/aes-256-gcm-siv"]
xchacha20-poly1305 = ["papilla/xchacha20-poly1305"]
aes-256-gcm = ["papilla/aes-256-gcm"]
simulator = []

[dependencies]
elanfp-core = { path = "../core" }
elanfp-ipc = { path = "../ipc" }
papilla = { git = "https://github.com/Redox-openDriver/papilla", tag = "v0.1.0", default-features = false }
drv-i18n = { git = "https://github.com/Redox-openDriver/drv-i18n", tag = "v0.1.0" }
zeroize = "1.9.2"
